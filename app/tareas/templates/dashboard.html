<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - GestiTask</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0a0f1e; font-family: 'Segoe UI', sans-serif; color: #fff; }

        .navbar {
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar h1 { font-size: 20px; font-weight: 700; }
        .navbar h1 span { color: #38bdf8; }

        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-logout:hover { background: rgba(255,255,255,0.12); }

        .container {
            padding: 40px 32px;
        }

        .welcome {
            margin-bottom: 32px;
        }

        .welcome h2 {
            font-size: 24px;
            font-weight: 600;
        }

        .welcome p {
            color: rgba(255,255,255,0.5);
            margin-top: 6px;
            font-size: 15px;
        }

        .boards-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .boards-header h3 { font-size: 16px; font-weight: 500; }

        .btn-new {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a6fd4, #38bdf8);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-new:hover { opacity: 0.9; transform: translateY(-1px); }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,0.3);
        }

        .empty-state p { font-size: 16px; margin-top: 12px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>Gesti<span>Task</span></h1>
        <div class="user-info">
            <span>Hola, {{ request.user.username }}</span>
            <a href="{% url 'logout' %}" class="btn-logout">Cerrar sesión</a>
        </div>
    </nav>

    <div class="container">
        <div class="welcome">
            <h2>Mis tableros</h2>
            <p>Organizá tu trabajo en tableros, listas y tarjetas.</p>
        </div>

        <div class="boards-header">
            <h3>Tableros recientes</h3>
            <button class="btn-new">+ Nuevo tablero</button>
        </div>

        <div class="empty-state">
            <p>No tenés tableros todavía. ¡Creá el primero!</p>
        </div>
    </div>
</body>
</html>
