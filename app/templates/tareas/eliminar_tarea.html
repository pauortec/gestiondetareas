{% extends "base.html" %}
{% block title %}Eliminar tarea{% endblock %}

{% block contenido %}
<div style="max-width:480px; margin:0 auto; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:32px;">
    <h2 style="font-size:20px; margin-bottom:12px;">¿Eliminar tarea?</h2>
    <p style="color:rgba(255,255,255,0.55); font-size:14px; margin-bottom:24px;">
        Estás por eliminar <strong style="color:#fff;">{{ tarea.titulo }}</strong>. Esta acción no se puede deshacer.
    </p>
    <form method="post" style="display:flex; gap:12px;">
        {% csrf_token %}
        <button type="submit" style="padding:10px 24px; background:#ef4444; border:none; border-radius:8px; color:#fff; font-size:14px; font-weight:600; cursor:pointer;">Eliminar</button>
        <a href="{% url 'detalle_tarea' tarea.pk %}" style="padding:10px 20px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:8px; color:rgba(255,255,255,0.65); font-size:14px; text-decoration:none;">Cancelar</a>
    </form>
</div>
{% endblock %}
