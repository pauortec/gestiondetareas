{% extends 'base.html' %}
{% block title %}Asignar tarea{% endblock %}

{% block estilos %}<style>
.form-box { background: rgba(255,255,255,0.04); padding: 24px; border-radius: 10px; max-width: 500px; }
.form-box select { width: 100%; padding: 10px; margin-top: 6px; background: #0d0d0d; color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; }
.btn { padding: 10px 18px; background: #fff; color: #0d0d0d; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn-cancel { background: rgba(255,255,255,0.07); color: #fff; margin-left: 8px; text-decoration: none; padding: 10px 18px; border-radius: 8px; }
</style>{% endblock %}

{% block contenido %}
<h2>Asignar "{{ tarea.titulo }}"</h2>
<p style="color:rgba(255,255,255,0.5); margin-bottom:20px;">Elegí el responsable. Va a poder ver y gestionar esta tarea aunque no esté en el proyecto.</p>

<form method="post" class="form-box">
    {% csrf_token %}
    <label style="font-size:13px; color:rgba(255,255,255,0.6);">Responsable</label>
    <select name="responsable">
        <option value="">(sin asignar)</option>
        {% for u in candidatos %}
        <option value="{{ u.pk }}" {% if tarea.responsable_id == u.pk %}selected{% endif %}>{{ u.username }}</option>
        {% endfor %}
    </select>
    <div style="margin-top:20px;">
        <button type="submit" class="btn">Guardar</button>
        <a class="btn-cancel" href="{% url 'lista_tareas' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
