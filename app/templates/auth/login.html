<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0f1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .bg-circles span {
            position: fixed;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            opacity: 0.08;
        }
        .bg-circles span:nth-child(1) { width: 400px; height: 400px; background: #1a6fd4; top: -100px; left: -100px; animation-delay: 0s; }
        .bg-circles span:nth-child(2) { width: 300px; height: 300px; background: #38bdf8; bottom: -80px; right: -80px; animation-delay: 2s; }
        .bg-circles span:nth-child(3) { width: 200px; height: 200px; background: #fef08a; top: 50%; left: 60%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo span {
            color: #38bdf8;
        }

        .logo p {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-top: 6px;
        }

        label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: border 0.3s, background 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            background: rgba(56,189,248,0.08);
        }

        .errorlist {
            color: #fca5a5;
            font-size: 12px;
            list-style: none;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: linear-gradient(135deg, #1a6fd4, #38bdf8);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }

        .footer-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bg-circles">
        <span></span><span></span><span></span>
    </div>

    <div class="card">
        <div class="logo">
            <h1>Gesti<span>Task</span></h1>
            <p>Iniciá sesión en tu cuenta</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endfor %}
            <button type="submit" class="btn">Entrar</button>
        </form>

        <p class="footer-link">¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
    </div>
</body>
</html>
