<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0d0d0d; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #fff; }

        .bg-circles span { position: fixed; border-radius: 50%; animation: float 6s infinite ease-in-out; opacity: 0.06; background: #fff; }
        .bg-circles span:nth-child(1) { width: 400px; height: 400px; top: -100px; left: -100px; animation-delay: 0s; }
        .bg-circles span:nth-child(2) { width: 300px; height: 300px; bottom: -80px; right: -80px; animation-delay: 2s; }
        .bg-circles span:nth-child(3) { width: 200px; height: 200px; top: 50%; left: 60%; animation-delay: 4s; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-30px); } }

        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(20px); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; animation: slideUp 0.6s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 1px; }
        .logo span { color: #fff; }
        .logo p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 6px; }

        label { display: block; color: rgba(255,255,255,0.75); font-size: 13px; margin-bottom: 6px; margin-top: 16px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 10px; color: #fff; font-size: 15px;
            transition: border 0.3s, background 0.3s; outline: none;
        }
        input:focus { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.10); }
        .helptext { color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 3px; display: block; }
        .errorlist { color: #fca5a5; font-size: 12px; list-style: none; margin-top: 4px; }

        .btn {
            width: 100%; padding: 13px; margin-top: 24px;
            background: #fff; color: #0d0d0d;
            border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s, transform 0.2s; letter-spacing: 0.5px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn:active { transform: scale(0.98); }

        .footer-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.5); font-size: 14px; }
        .footer-link a { color: #fff; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="bg-circles">
        <span></span><span></span><span></span>
    </div>

    <div class="card">
        <div class="logo">
            <h1>Gesti<span>Task</span></h1>
            <p>Creá tu cuenta</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endfor %}
            <button type="submit" class="btn">Crear cuenta</button>
        </form>

        <p class="footer-link">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
    </div>
</body>
</html>
