<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #f9fafb; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; color: #111827; }

        .card {
            background: #fff; border: 1px solid #e5e7eb;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-radius: 16px; padding: 40px;
            width: 100%; max-width: 400px;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 26px; font-weight: 700; color: #111827; letter-spacing: 1px; }
        .logo p { color: #6b7280; font-size: 14px; margin-top: 6px; }

        label { display: block; color: #374151; font-size: 13px; font-weight: 500; margin-bottom: 6px; margin-top: 16px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 11px 14px;
            background: #fff; border: 1px solid #e5e7eb;
            border-radius: 8px; color: #111827; font-size: 15px;
            transition: border 0.2s; outline: none;
        }
        input:focus { border-color: #6b7280; }
        .helptext { color: #9ca3af; font-size: 11px; margin-top: 3px; display: block; }
        .errorlist { color: #dc2626; font-size: 12px; list-style: none; margin-top: 4px; }

        .btn {
            width: 100%; padding: 12px; margin-top: 24px;
            background: #111827; color: #fff;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #374151; }

        .footer-link { text-align: center; margin-top: 20px; color: #6b7280; font-size: 14px; }
        .footer-link a { color: #111827; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>GestiTask</h1>
            <p>Creá tu cuenta</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endfor %}
            <button type="submit" class="btn">Crear cuenta</button>
        </form>

        <p class="footer-link">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
    </div>
</body>
</html>
