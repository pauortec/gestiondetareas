{% extends "base.html" %}
{% block title %}Nuevo tablero - GestiTask{% endblock %}

{% block estilos %}
<style>
.form-card {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.form-card h2 { font-size: 20px; margin-bottom: 24px; color: #111827; }

.field { margin-bottom: 20px; }
.field label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; font-weight: 500; }
.field input, .field select {
    width: 100%;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    color: #111827;
    font-size: 14px;
}
.field input:focus, .field select:focus {
    outline: none;
    border-color: #6b7280;
}
.field select option { background: #fff; color: #111827; }
.actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-primary {
    flex: 1;
    padding: 11px;
    background: #111827;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}
.btn-primary:hover { background: #374151; }
.btn-cancel {
    padding: 11px 20px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    color: #6b7280;
    font-size: 14px;
    text-decoration: none;
    text-align: center;
}
.btn-cancel:hover { background: #f9fafb; }
</style>
{% endblock %}

{% block contenido %}
<div class="form-card">
    <h2>Nuevo tablero</h2>
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label for="nombre">Nombre del proyecto</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Sistema de ventas" required autofocus>
        </div>
        <div class="field">
            <label for="etapa">Etapa</label>
            <select id="etapa" name="etapa">
                {% for codigo, label in etapas %}
                <option value="{{ codigo }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="actions">
            <a href="{% url 'dashboard' %}" class="btn-cancel">Cancelar</a>
            <button type="submit" class="btn-primary">Crear tablero</button>
        </div>
    </form>
</div>
{% endblock %}
