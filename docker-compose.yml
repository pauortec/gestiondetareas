# Contenedores del proyecto: Django, Postgres y pgAdmin

services:
  # Servicio web con Django
  web:
    build: .
    container_name: gestion_tareas_cont
    command: python app/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/code/app
      - ./volumes/media:/code/media
    ports:
      - "8000:8000"
    restart: on-failure
    environment:
      DB_NAME: gestion_tareas
      DB_USER: gestion_user
      DB_PASSWORD: gestion_pass
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Base de datos PostgreSQL
  db:
    image: postgres:16
    container_name: gestion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_tareas
      POSTGRES_USER: gestion_user
      POSTGRES_PASSWORD: gestion_pass
    volumes:
      - ./volumes/pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_user -d gestion_tareas"]
      interval: 5s
      retries: 5

  # Redis como backend del channel layer para WebSockets
  redis:
    image: redis:7
    container_name: gestion_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # pgAdmin para administrar la base desde el navegador (http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4
    container_name: gestion_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gestion.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      # Volumen administrado por Docker, asi no hay problemas de permisos
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db

# Volumenes nombrados (los administra Docker, no son carpetas del proyecto)
volumes:
  pgadmin_data:
